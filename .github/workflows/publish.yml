# Pasa los cambios de la rama staging (los que haces en el panel de
# administración) a la rama main, es decir, a la web pública.
# Se lanza a mano: Actions → «Publicar staging en la web» → Run workflow.
name: Publicar staging en la web

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fusionar staging en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin staging
          if git merge-base --is-ancestor origin/staging HEAD; then
            echo "No hay cambios nuevos en staging."
          else
            git merge --no-ff origin/staging -m "Publicar cambios de staging en la web"
            git push origin main
          fi
          # Dejar staging igual que main para que el siguiente cambio parta de lo publicado
          git push origin HEAD:staging

      - name: Regenerar la web publicada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
