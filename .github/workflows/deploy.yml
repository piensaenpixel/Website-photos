# Publica la web en la rama gh-pages cada vez que se hace push a main.
# GitHub Pages sirve el contenido de esa rama en
# https://piensaenpixel.github.io/Website-photos/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar la carpeta a publicar
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' --exclude 'scripts' ./ _site/
          # Versión en los enlaces a CSS y JS para que el navegador no use copias antiguas
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publicar web desde ${{ github.sha }}"
