# Publica la web en GitHub Pages (rama gh-pages):
#   - la rama main      → https://piensaenpixel.github.io/Website-photos/
#   - la rama staging   → https://piensaenpixel.github.io/Website-photos/staging/
# Se ejecuta con cada push a main o staging, y también a mano.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main

      - name: Descargar la rama staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: src-staging

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (para reducir imágenes)
        run: pip install --quiet pillow

      - name: Montar la web pública (main)
        run: |
          MAIN_SHA=$(git -C src-main rev-parse --short=8 HEAD)
          python3 src-main/scripts/build_site.py src-main _site --env production --version "$MAIN_SHA"

      - name: Montar la web de staging
        run: |
          STAGING_SHA=$(git -C src-staging rev-parse --short=8 HEAD)
          python3 src-staging/scripts/build_site.py src-staging _site/staging --env staging --version "$STAGING_SHA"

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publicar web (main ${{ github.sha }})"
